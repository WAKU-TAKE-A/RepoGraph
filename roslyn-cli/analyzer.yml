exclude:
  directories:
    - bin
    - obj
    - lib
    - packages
    - node_modules
    - TestResults
    - datasources    
  filePatterns:
    - "*.Designer.cs"
    - "*.g.cs"
    - "*.generated.cs"
    - "*.AssemblyInfo.cs"
    - "*.AssemblyAttributes.cs"
    - "*.png"
    - "*.bmp"
    - "*.ico"
    - "*.png"
    - "*.dll"
    - "*.user"
    - "*.datasource"
    - "*.bak"
    - "*.resx"
  paths:
    - "**/Service References/**"
    - "**/Connected Services/**"
  namespaces:
    - "*.Generated.*"

analysis:
  includeCallGraph: true
  includeInheritance: true
  includeInterfaceMappings: true
  includeMethodBodies: true

performance:
  parallelism: 4
  maxDocumentSizeMB: 8
